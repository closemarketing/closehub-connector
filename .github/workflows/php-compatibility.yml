name: PHP compatibility

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  compatibility:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '7.4'
          - '8.1'
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Check PHP syntax
        run: |
          for source_file in closehub-connector.php uninstall.php includes/*.php tests/*-test.php; do
            php -l "$source_file"
          done

      - name: Run compatibility tests
        run: |
          for test_file in tests/*-test.php; do
            php "$test_file"
          done
